name: Live-Statistik anstoßen

# Ruft alle 30 Minuten die Live-Daten ab. Dabei schreibt der Vercel-Server die Pünktlichkeits-Statistik fort,
# auch wenn gerade niemand die App offen hat.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Live-Daten abrufen
        env:
          RT: ${{ vars.STRAB_RT_URL || 'https://strabfahrt.vercel.app' }}
        run: curl -fsS -m 90 -o /dev/null -w '%{http_code}\n' "$RT/api/delays?ping=$(date +%s)"
