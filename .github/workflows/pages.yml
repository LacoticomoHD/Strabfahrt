name: Seite bauen und veröffentlichen

# Baut jede Nacht die statische Web-Variante mit frischen KVV-Fahrplandaten
# und veröffentlicht sie auf dem Branch gh-pages (GitHub Pages: Deploy from a branch).

on:
  schedule:
    - cron: '17 2 * * *' # täglich, Zeit in UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: seite-bauen
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Fahrplan-Feeds laden und Modell bauen (KVV, Fern-, Regional-, Nahverkehr)
        run: npm run build:data
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Daten prüfen (bricht vor dem Veröffentlichen ab, wenn etwas fehlt)
        run: npm run check:data

      - name: Kalenderwoche für den Gleis-Cache
        id: week
        run: echo "w=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: OpenStreetMap-Daten aus dem Wochen-Cache holen
        uses: actions/cache@v4
        with:
          path: |
            data/osm-rail3.json
            data/osm-bus2.json
            data/osm-road2.json
          key: osm-v3-${{ steps.week.outputs.w }}

      - name: Fahrzeuge auf OpenStreetMap-Gleise und -Straßen legen
        continue-on-error: true # ohne OSM-Daten fahren die Fahrzeuge in Luftlinie weiter
        run: npm run snap:rail

      - name: Statische Variante mit Karte bauen
        run: npm run build:static -- --tiles
        env:
          # Live-Server (Vercel). Mit der Repository-Variable STRAB_RT_URL überschreibbar
          STRAB_RT_URL: ${{ vars.STRAB_RT_URL || 'https://strabfahrt.vercel.app' }}

      - name: Fertige Seite prüfen
        run: |
          for f in index.html app.js model.json model.js local-api.js sw.js; do test -s "dist-static/$f" || { echo "fehlt: $f"; exit 1; }; done

      - name: Auf gh-pages veröffentlichen
        env:
          # Eigene Domain (z. B. strabfahrt.de): Repository-Variable STRAB_DOMAIN setzen, dann bleibt sie bei jedem Bau erhalten
          STRAB_DOMAIN: ${{ vars.STRAB_DOMAIN }}
        run: |
          cd dist-static
          touch .nojekyll
          if [ -n "$STRAB_DOMAIN" ]; then echo "$STRAB_DOMAIN" > CNAME; fi
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Seite gebaut am $(date -u +%F)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages
