name: Seite bauen und veröffentlichen

# Baut jede Nacht die statische Web-Variante mit frischen KVV-Fahrplandaten
# und veröffentlicht sie auf dem Branch gh-pages (GitHub Pages: Deploy from a branch).

on:
  schedule:
    - cron: '17 2 * * *' # täglich, Zeit in UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: seite-bauen
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: KVV-Feed laden und Modell bauen
        run: npm run build:data

      - name: Kalenderwoche für den Gleis-Cache
        id: week
        run: echo "w=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: OpenStreetMap-Daten aus dem Wochen-Cache holen
        uses: actions/cache@v4
        with:
          path: |
            data/osm-rail.json
            data/osm-bus.json
          key: osm-${{ steps.week.outputs.w }}

      - name: Fahrzeuge auf OpenStreetMap-Gleise und -Straßen legen
        continue-on-error: true # ohne OSM-Daten fahren die Fahrzeuge in Luftlinie weiter
        run: npm run snap:rail

      - name: Statische Variante mit Karte bauen
        run: npm run build:static -- --tiles

      - name: Auf gh-pages veröffentlichen
        run: |
          cd dist-static
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Seite gebaut am $(date -u +%F)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages
