<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STRABFAHRT – Fahrzeuge im Raum Karlsruhe</title>
  <meta name="description" content="Karte der Bahnen und Busse im Raum Karlsruhe nach Fahrplan, mit Abfahrtsanzeige je Haltestelle.">
  <meta name="theme-color" content="#0b5cad">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="map" role="application" aria-label="Karte"></div>

  <header id="top">
    <h1>STRABFAHRT</h1>
    <div id="searchbox">
      <label for="search" class="sr">Haltestelle suchen</label>
      <input id="search" type="search" placeholder="Haltestelle suchen" autocomplete="off" spellcheck="false">
      <ul id="results" hidden></ul>
    </div>
    <nav id="tools" aria-label="Werkzeuge">
      <button id="btn-favs" type="button" aria-label="Favoriten">★<span>Favoriten</span></button>
      <button id="btn-nearby" type="button" aria-label="In der Nähe">◎<span>Nähe</span></button>
      <button id="btn-route" type="button" aria-label="Verbindung suchen">⇄<span>Route</span></button>
      <button id="btn-lines" type="button" aria-label="Linien filtern">☰<span>Linien</span></button>
      <button id="btn-theme" type="button" aria-label="Dunkelmodus" aria-pressed="false">☾</button>
      <button id="btn-install" type="button" aria-label="App installieren" hidden>⤓<span>Installieren</span></button>
    </nav>
  </header>

  <div id="legend" hidden></div>

  <div id="board" hidden></div>

  <aside id="panel" hidden aria-live="polite">
    <button id="panel-close" type="button" aria-label="Schließen">×</button>
    <div id="panel-body"></div>
  </aside>

  <footer id="bar">
    <p id="notice" role="status" hidden></p>
    <div class="row">
      <button id="play" type="button" aria-label="Pause">❚❚</button>
      <label class="sr" for="speed">Geschwindigkeit</label>
      <select id="speed">
        <option value="1">1×</option>
        <option value="5">5×</option>
        <option value="10">10×</option>
        <option value="30">30×</option>
        <option value="60">60×</option>
        <option value="120">120×</option>
      </select>
      <span id="clock" aria-label="Simulierte Uhrzeit">--:--:--</span>
      <label class="sr" for="when">Datum und Uhrzeit</label>
      <input id="when" type="datetime-local">
      <button id="now" type="button">Jetzt</button>
      <button id="night" type="button" title="Springt auf 01:30 und zeigt, welche Linien nachts fahren">☾ Nacht</button>
      <span id="count" aria-live="off"></span>
      <button id="collapse" type="button" aria-label="Optionen ein- oder ausklappen" aria-expanded="true">⋯</button>
    </div>
    <div class="row">
      <label class="sr" for="tl">Uhrzeit des Tages</label>
      <input id="tl" type="range" min="0" max="1439" step="1" value="720">
    </div>
    <div class="row filters">
      <label><input type="checkbox" data-type="tram" checked> Tram</label>
      <label><input type="checkbox" data-type="rail" checked> Bahn</label>
      <label><input type="checkbox" data-type="bus" checked> Bus</label>
      <label><input type="checkbox" data-type="other" checked> Sonstige</label>
      <label><input type="checkbox" id="acc"> ♿ nur barrierefrei</label>
      <label title="Der KVV-Feed nennt nur Verbote. Blendet Fahrten aus, bei denen Fahrräder ausdrücklich nicht erlaubt sind."><input type="checkbox" id="bike"> 🚲 Fahrrad nicht verboten</label>
      <label title="Zeigt einen Schweif hinter den Fahrzeugen"><input type="checkbox" id="trails"> Spuren</label>
      <label title="Färbt Haltestellen nach Abfahrten pro Stunde"><input type="checkbox" id="takt"> Takt</label>
      <label title="Zeigt erfundene Werte, um die Darstellung zu sehen. Echte Verspätungen gibt es noch nicht."><input type="checkbox" id="demo"> Demo-Verspätung (erfunden)</label>
      <span class="sep ovl"></span>
      <label class="ovl"><input type="checkbox" id="ovl-infra"> Gleise</label>
      <label class="ovl"><input type="checkbox" id="ovl-signals"> Signale</label>
      <label class="ovl"><input type="checkbox" id="ovl-maxspeed"> Tempo</label>
    </div>
    <p id="note">Positionen nach Fahrplan (Soll), keine Echtzeit. Daten: KVV (CC0), Karte: © OpenStreetMap-Mitwirkende. Ohne Gewähr.</p>
  </footer>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
